[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formwork"
version = "0.2.0"
description = "SharePoint page copier: extract, process, apply."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shaun Eccles-Smith" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
formwork = "formwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "TRY", "RUF"]
ignore = [
    "TRY003", # operator-facing messages on exceptions are the point here
    "TRY004", # ValueError is the right error for malformed bundle content
]

[tool.ruff.lint.per-file-ignores]
# Fixture counts and lengths ARE the fact under test.
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
