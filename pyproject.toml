[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formwork"
version = "0.6.0"
description = "Declarative SharePoint modern pages: declare, compile, preview, apply; and copy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shaun Eccles-Smith" }]
dependencies = ["pyyaml>=6.0", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[tool.uv]
# CI runs `uv sync --frozen`, so uv.lock is the single source of truth for
# what the gates run against — a PR cannot pass CI on locally-upgraded deps.

[project.scripts]
formwork = "formwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Jinja templates are the display layer; a wheel without them renders nothing.
formwork = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "TRY", "RUF"]
ignore = [
    "TRY003", # operator-facing messages on exceptions are the point here
    "TRY004", # ValueError is the right error for malformed bundle content
]

[tool.ruff.lint.per-file-ignores]
# Fixture counts and lengths ARE the fact under test.
"tests/*" = ["PLR2004"]
# The unicode round-trip test needs a typographic apostrophe on purpose
# (re-review 2026-09-07: the dirty render must not mangle it).
"tests/test_canvas.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
