name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Which interpreter is under test (evidence, not the job name)
        run: uv run --no-sync python -VV
      - name: Install
        run: uv sync --locked
      - name: Pytest
        run: uv run --no-sync pytest -q

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Mypy
        run: uv run --no-sync mypy src

  node-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install
        run: uv sync --locked
      - name: All five generated scripts are valid JS (review 2026-09-08 P2-4)
        run: |
          uv run --no-sync python -c "
          from formwork.generator import generate_extract_script, generate_discover_script, generate_apply_script, generate_findprobe_script
          from formwork.findings import load_findings
          from pathlib import Path
          import subprocess, json
          scripts = [
              generate_extract_script(),
              generate_discover_script(),
              generate_apply_script(),
              generate_apply_script(page_name='X', canvas_payload=json.dumps({'canvas': '<div></div>', 'title': 'X'})),
              generate_findprobe_script(load_findings(Path('FINDINGS.md'))),
          ]
          for i, s in enumerate(scripts):
              p = Path(f'/tmp/fw-generated-{i}.js'); p.write_text(s, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)
          print('node --check passed for', len(scripts), 'generated scripts')
          "
