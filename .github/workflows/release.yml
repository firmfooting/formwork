name: Release

# M11: on a version tag, run the test suite, then build the wheel + sdist
# and attach them to a GitHub release. Actions are SHA-pinned (house rule);
# permissions are contents:read for building and contents:write only on the
# one job that publishes the release.
#
# Review 2026-09-08 fixes: the build job gates on the suite (a tag on a
# broken main cannot release), asserts the tag matches pyproject's version
# (v0.7.0 must carry formwork-0.7.0), pins the build toolchain (the
# published artifact's provenance should not float), and the release job
# passes GH_REPO explicitly (it has no checkout, so gh has no other way to
# know the repository).

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked
      - name: The tag must match the version being released
        run: |
          version="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "pyproject version: $version; tag: ${GITHUB_REF_NAME}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Pytest
        run: uv run --no-sync pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      # The build frontend is NOT a project dependency, and this job never
      # runs `uv sync`, so it must be injected into the run environment
      # explicitly. `--with` supplies it (pinned, so the artifact's
      # provenance does not float); `uv tool install` alone only put a
      # `pyproject-build` binary on PATH that nothing ever invoked.
      - name: Build wheel and sdist with the pinned build frontend
        run: uv run --locked --no-sync --with "build==1.6.1" python -m build
        env:
          UV_NO_CACHE: "1"
      - name: The wheel must ship every template (a wheel without them renders nothing)
        run: |
          expected="$(ls src/formwork/templates/*.j2 | wc -l)"
          shipped="$(unzip -l dist/*.whl | grep -c 'templates/.*\.j2')"
          echo "templates: ${shipped} shipped, ${expected} in the tree"
          test "${shipped}" = "${expected}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the built artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
