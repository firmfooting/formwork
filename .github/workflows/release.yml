# Release management + PyPI publication in one workflow. The filename is
# load-bearing: the PyPI pending trusted publisher for formwork-sp is bound
# to THIS file (release.yml) and the `pypi` environment, so the publish job
# must live here and the environment name must match exactly.
#
# Flow: conventional commits land on main -> release-please maintains a
# release PR (version bump + CHANGELOG) -> merging it makes release-please
# (in that same push's run) create the vX.Y.Z tag + GitHub release and set
# release_created=true -> the build and publish jobs run in the SAME run.
#
# release-please authenticates as the firmfooting-bot GitHub App (org secrets
# RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY, visibility: all) rather
# than as GITHUB_TOKEN. A pull request opened with the default token
# triggers no workflows, so a release PR would report no checks at all and
# sit BLOCKED against any required ones with nothing able to clear them —
# dbml-sharepoint's 0.5.0 waited eight days that way. An installation token
# is a real actor: ci.yml and zizmor.yml run on the release PR like any
# other, and the flow keeps working if main ever gains required checks.
#
# The build and publish jobs run in the same run as the merge that cuts the
# release: an app-created release CAN trigger an on:release workflow, but
# the trusted-publisher binding above keeps publish here regardless, and
# one run is easier to follow than two.
#
# The version lives ONCE, in src/formwork/__init__.py (the
# x-release-please-version annotation). pyproject.toml reads it via
# tool.setuptools.dynamic. A static [project].version would make every bump
# stale uv.lock (the lock records the root package's version) and fail the
# `uv sync --locked` gate on the merge commit.
#
# Distribution name note: PyPI projects cannot be renamed and `formwork` was
# taken, so the package publishes as formwork-sp. The import package
# (formwork), the CLI command (formwork) and the wheel's module layout are
# unchanged; only the distribution name differs. The publish job's
# repository-url pins the target so a future name decision cannot silently
# publish elsewhere.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Nothing is taken from GITHUB_TOKEN. The app token minted below does
    # every write, and being a different actor is the whole point.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Fail closed before release-please runs. A missing secret would
      # otherwise surface as an opaque token-exchange error inside the
      # action; either way the recovery is to set the org secret.
      - name: Require the release app secrets
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_CLIENT_ID}" ]; then
            echo "RELEASE_APP_CLIENT_ID is not set; refusing to release." >&2
            exit 1
          fi
          if [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "RELEASE_APP_PRIVATE_KEY is not set; refusing to release." >&2
            exit 1
          fi

      # Short-lived, scoped to this repository's installation, masked in the
      # log and revoked when the job ends. Same action, same SHA as
      # dbml-sharepoint's publish job — one app-token pattern to review.
      - name: Mint an installation token for this repository
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Build the tagged tree when release-please cut a release (it holds the
      # bumped version), not whatever main has drifted to since.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false # release artifacts are never built from a cache
      # The version the wheel claims must be the version the tag names.
      # release-please already asserts this at PR time; assert it again at
      # build time so a skipped or partially-applied PR cannot ship. The
      # literal is PARSED, not imported: a checkout of the tag has no
      # project installed, so `import formwork` under --no-sync finds
      # nothing (that exact mistake failed the first 0.7.0 build).
      - name: The tag must match the version being released
        if: needs.release-please.outputs.release_created == 'true'
        run: |
          version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/formwork/__init__.py)"
          echo "__init__ version: $version; tag: ${GITHUB_REF_NAME}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Run the test suite
        run: |
          uv sync --locked
          uv run --no-sync pytest -q
      - name: Build the wheel and sdist
        run: uv build
      - name: The wheel must ship every template (a wheel without them renders nothing)
        run: |
          expected="$(ls src/formwork/templates/*.j2 | wc -l)"
          shipped="$(unzip -l dist/*.whl | grep -c 'templates/.*\.j2')"
          echo "templates: ${shipped} shipped, ${expected} in the tree"
          test "${shipped}" = "${expected}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The PyPI pending trusted publisher names this environment. Repository
    # environments are a security boundary: it has a custom branch policy
    # (main only), so a workflow from any other ref cannot publish.
    environment:
      name: pypi
      url: https://pypi.org/project/formwork-sp/
    permissions:
      id-token: write # OIDC trusted publishing; no API token anywhere
      contents: write # attach the artifacts to the GitHub release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # release-please's release carries notes, not artifacts. The wheels
      # belong on the release page too (the README points installers there).
      # Env-indirected so the tag never lands in the script text.
      - name: Attach the artifacts to the GitHub release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" dist/* --clobber
      # v1.14.2, the same release dbml-sharepoint publishes with. The
      # pending PyPI registration's "v1.12.4" is only the version snapshot
      # at registration time, not a requirement — v1.12.4 carries a known
      # GHSA (zizmor's known-vulnerable-actions audit rejects it), v1.14.2
      # is the patched line. Trusted publishing is version-agnostic.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
