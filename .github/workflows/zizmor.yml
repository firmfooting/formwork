# Static security audit of the workflows themselves (zizmor). Fails the run
# on any finding: unpinned actions, excessive permissions, credential
# persistence, template injection, cache poisoning in release paths, etc.
name: Workflow security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Audit workflows (pinned — the security gate must be reproducible)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: uvx zizmor@1.29.0 .github/workflows
